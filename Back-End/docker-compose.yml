version: '3.8'

# Global DNS settings for all services to fix network connectivity issues
x-common-dns-settings: &common-dns
  dns:
    - 8.8.8.8
    - 8.8.4.4

services:
  # ======= INFRASTRUCTURE SERVICES =======
  
  # Discovery Service
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # Disable self-registration to prevent issues
      - EUREKA_CLIENT_REGISTER-WITH-EUREKA=false
      - EUREKA_CLIENT_FETCH-REGISTRY=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - andah-network
    <<: *common-dns

  # Configuration Server
  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker,native
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    volumes:
      - ./config-repo:/config-repo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - andah-network
    <<: *common-dns

  # API Gateway
  api-gateway:
    build:
      context: api-gateway
    ports:
      - "8080:8090"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    healthcheck:
      test: "curl --fail --silent localhost:8090/actuator/health | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - andah-network

  # ======= DATABASE SERVICES =======

  # PostgreSQL for User/Station/Scooter Services
  postgres-db:
    image: postgres:14-alpine
    container_name: postgres-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - andah-network

  # MySQL for Reservation Service
  mysql-db:
    image: mysql:8
    container_name: mysql-db
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=reservationT
      - MYSQL_USER=andah
      - MYSQL_PASSWORD=andah
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - andah-network

  # MongoDB for Payment Service
  mongodb-payment-db:
    image: mongo:6.0
    container_name: mongodb-payment-db
    environment:
      - MONGO_INITDB_DATABASE=andah_payments
      - MONGO_INITDB_ROOT_USERNAME=mongodb
      - MONGO_INITDB_ROOT_PASSWORD=mongodb
    ports:
      - "27017:27017"
    command: mongod --bind_ip_all --auth
    volumes:
      - mongodb-payment-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - andah-network

  # ======= BUSINESS SERVICES =======

  # User Service
  user-service:
    build:
      context: user-service
    ports:
      - "8083:8083"
    depends_on:
      postgres-db:
        condition: service_healthy
      mongodb-payment-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATA_MONGODB_HOST=mongodb-payment-db
      - SPRING_DATA_MONGODB_PORT=27017
      - SPRING_DATA_MONGODB_DATABASE=andah_payments
      - SPRING_DATA_MONGODB_USERNAME=mongodb
      - SPRING_DATA_MONGODB_PASSWORD=mongodb
      - SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE=admin
    healthcheck:
      test: "curl --fail --silent localhost:8083/actuator/health | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - andah-network

  # Station Service
  station-service:
    build: ./station-service
    container_name: station-service
    ports:
      - "8084:8084"
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      # Enable Eureka client features
      - EUREKA_CLIENT_REGISTER-WITH-EUREKA=true
      - EUREKA_CLIENT_FETCH-REGISTRY=true
      # PostgreSQL connection
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      # Ensure instance is properly registered
      - EUREKA_INSTANCE_PREFER-IP-ADDRESS=true
      - EUREKA_INSTANCE_INSTANCE-ID=$${spring.application.name}:$${server.port}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - andah-network
    <<: *common-dns
  
  # Payment Service
  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8085:8085"
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb-payment-db:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      # Enable Eureka client features
      - EUREKA_CLIENT_ENABLED=true
      - EUREKA_CLIENT_REGISTER-WITH-EUREKA=true
      - EUREKA_CLIENT_FETCH-REGISTRY=true
      # Ensure instance is properly registered
      - EUREKA_INSTANCE_PREFER-IP-ADDRESS=true
      - EUREKA_INSTANCE_INSTANCE-ID=$${spring.application.name}:$${server.port}
      # MongoDB connection
      - SPRING_DATA_MONGODB_HOST=mongodb-payment-db
      - SPRING_DATA_MONGODB_PORT=27017
      - SPRING_DATA_MONGODB_DATABASE=andah_payments
      - SPRING_DATA_MONGODB_USERNAME=mongodb
      - SPRING_DATA_MONGODB_PASSWORD=mongodb
      - SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE=admin
      # Callback URLs for payments (replacing localhost)
      - NOWPAYMENTS_IPN_CALLBACK_URL=http://payment-service:8085/api/crypto-transactions/nowpayments/ipn-callback
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - andah-network
    <<: *common-dns
  
  # Scooter Service
  scooter-service:
    build: ./scooter-service
    container_name: scooter-service
    ports:
      - "8086:8086"
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      # Enable Eureka client features
      - EUREKA_CLIENT_REGISTER-WITH-EUREKA=true
      - EUREKA_CLIENT_FETCH-REGISTRY=true
      # PostgreSQL connection
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      # Ensure instance is properly registered
      - EUREKA_INSTANCE_PREFER-IP-ADDRESS=true
      - EUREKA_INSTANCE_INSTANCE-ID=$${spring.application.name}:$${server.port}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - andah-network
    <<: *common-dns
  
  # Reservation Service
  reservation-service:
    build: ./reservation-service
    container_name: reservation-service
    ports:
      - "8087:8087"
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      # Enable Eureka client features
      - EUREKA_CLIENT_REGISTER-WITH-EUREKA=true
      - EUREKA_CLIENT_FETCH-REGISTRY=true
      # MySQL connection
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/reservationT?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      # Ensure instance is properly registered
      - EUREKA_INSTANCE_PREFER-IP-ADDRESS=true
      - EUREKA_INSTANCE_INSTANCE-ID=$${spring.application.name}:$${server.port}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - andah-network
    <<: *common-dns

networks:
  andah-network:
    driver: bridge

volumes:
  postgres-data:
  mysql-data:
  mongodb-payment-data:
