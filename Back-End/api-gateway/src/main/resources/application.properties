spring.application.name=api-gateway
server.port=8090

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Spring Cloud Gateway Routes - SIMPLIFIED FOR TESTING

# Enable URL-based route discovery
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# User Service Route - Direct connection without tokens
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://user-service:8083
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**, /api/auth/**
spring.cloud.gateway.routes[0].filters[0]=RemoveRequestHeader=Authorization
spring.cloud.gateway.routes[0].filters[1]=RemoveRequestHeader=Cookie

# Station Service Route - Direct connection without tokens
spring.cloud.gateway.routes[1].id=station-service
spring.cloud.gateway.routes[1].uri=http://station-service:8084
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/stations/**
spring.cloud.gateway.routes[1].filters[0]=RemoveRequestHeader=Authorization
spring.cloud.gateway.routes[1].filters[1]=RemoveRequestHeader=Cookie

# Scooter Service Route - Direct connection without tokens
spring.cloud.gateway.routes[2].id=scooter-service
spring.cloud.gateway.routes[2].uri=http://scooter-service:8086
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/scooters/**
spring.cloud.gateway.routes[2].filters[0]=RemoveRequestHeader=Authorization
spring.cloud.gateway.routes[2].filters[1]=RemoveRequestHeader=Cookie

# Reservation Service Route - Direct connection without tokens
spring.cloud.gateway.routes[3].id=reservation-service
spring.cloud.gateway.routes[3].uri=http://reservation-service:8087
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/reservations/**
spring.cloud.gateway.routes[3].filters[0]=RemoveRequestHeader=Authorization
spring.cloud.gateway.routes[3].filters[1]=RemoveRequestHeader=Cookie

# Payment Service Route - Direct connection without tokens
spring.cloud.gateway.routes[4].id=payment-service
spring.cloud.gateway.routes[4].uri=http://payment-service:8085
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/wallets/**, /api/payments/**
spring.cloud.gateway.routes[4].filters[0]=RemoveRequestHeader=Authorization
spring.cloud.gateway.routes[4].filters[1]=RemoveRequestHeader=Cookie

# Reclamation Service Route - Direct connection without tokens
spring.cloud.gateway.routes[5].id=reclamation-service
spring.cloud.gateway.routes[5].uri=http://reclamation-service:3001
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/reclamations/**
spring.cloud.gateway.routes[5].filters[0]=RemoveRequestHeader=Authorization
spring.cloud.gateway.routes[5].filters[1]=RemoveRequestHeader=Cookie

# Disable all security configurations
spring.security.oauth2.resourceserver.jwt.issuer-uri=
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=

# Remove JWT security
app.jwt.secret=
app.jwt.expiration=0

# Global CORS Configuration for all routes
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].maxAge=3600
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true

# Add header manipulation to remove Authorization headers for testing
spring.cloud.gateway.default-filters=RemoveRequestHeader=Authorization, RemoveRequestHeader=Cookie, DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, AddResponseHeader=Access-Control-Allow-Origin=*

# Actuator endpoints for monitoring
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Config Server Connection
spring.config.import=optional:configserver:http://localhost:8888