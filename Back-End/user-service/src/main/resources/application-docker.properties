# Application configuration
spring.application.name=user-service
server.port=8081

# MySQL Database configuration for Docker environment
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://mysql:3306/userservice?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=andahscooterplatformsecretkeyfortheuserservicejwttoken
jwt.expiration=86400000

# Eureka Client Configuration for Docker environment
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

# Actuator endpoints for service health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


app.jwt.secret=andahSecretKey123ForAllServices
app.jwt.expiration=86400000