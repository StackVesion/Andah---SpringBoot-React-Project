# Application configuration
spring.application.name=USER-SERVICE
server.port=8083

# Enable bean definition overriding
spring.main.allow-bean-definition-overriding=true

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=userservice
spring.data.mongodb.auto-index-creation=true

# Disable JPA/Hibernate auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# JWT Configuration - Use simple secret
jwt.secret=andahscooterplatformsecretkeyfortheuserservicejwttoken
jwt.expiration=86400000

# Eureka Client Configuration
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.preferIpAddress=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.instanceId=${spring.application.name}:${server.port}

# Additional debugging settings
logging.level.org.springframework.web=TRACE
logging.level.org.springframework.security=TRACE
logging.level.com.andah.userservice=DEBUG
logging.level.org.springframework.data.mongodb=INFO

# CORS Configuration
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.max-age=3600

# Actuator endpoints for service health
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# OTP Configuration
app.otp.expiry-minutes=5
app.otp.issuer=AndahScooterApp
app.otp.length=6
app.otp.default-code=123456
app.otp.use-random=true

# Email Configuration - Fixed and improved
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=hlelikhairi04@gmail.com
spring.mail.password=fqgo guyt srrq cjvm
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Set to false to properly handle errors
app.email.simulation=false

# Keycloak Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/andah
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/andah/protocol/openid-connect/certs
