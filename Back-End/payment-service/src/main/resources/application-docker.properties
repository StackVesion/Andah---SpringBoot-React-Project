spring.application.name=payment-service
server.port=8085

# Server configuration
server.servlet.context-path=/
spring.mvc.static-path-pattern=/static/**
# Disable resource handling for API paths
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# MongoDB Configuration for Docker
spring.data.mongodb.host=mongodb-payment-db
spring.data.mongodb.port=27017
spring.data.mongodb.database=andah_payments
spring.data.mongodb.username=mongodb
spring.data.mongodb.password=mongodb
spring.data.mongodb.authentication-database=admin

# Eureka Configuration for Docker
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Actuator Configuration - Needed for health checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.diskspace.enabled=true

