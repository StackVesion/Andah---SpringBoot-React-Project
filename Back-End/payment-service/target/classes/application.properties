spring.application.name=payment-service
server.port=8085

# Server configuration
server.servlet.context-path=/
spring.mvc.static-path-pattern=/static/**
# Disable resource handling for API paths
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# MongoDB Configuration without authentication
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=andah_payments
# Remove all authentication properties to use default MongoDB without auth

# Eureka Configuration - Disabled for local development
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

